<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra - Event Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,system-ui,sans-serif}.modal{display:none}.modal.show{display:flex}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
  <div><h1 class="text-xl font-bold">Astra Event Manager</h1><p class="text-xs text-slate-500">Create, edit and delete events from a separate page.</p></div>
  <a href="index.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-semibold"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Astra</a>
</header>
<main class="max-w-6xl mx-auto p-6 md:p-8">
  <div class="flex items-center justify-between mb-6">
    <div><h2 class="text-2xl font-bold">Events</h2><p class="text-sm text-slate-500">Changes are saved in this browser and will appear on the Astra page.</p></div>
    <button onclick="openForm()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold"><i class="fa-solid fa-plus mr-2"></i>Add Event</button>
  </div>
  <div id="events" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>
<div id="modal" class="modal fixed inset-0 z-50 bg-slate-900/60 items-center justify-center p-4">
 <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6">
  <div class="flex justify-between items-center mb-5"><h3 id="formTitle" class="text-lg font-bold">Add Event</h3><button onclick="closeForm()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button></div>
  <form onsubmit="saveEvent(event)" class="space-y-4">
   <input type="hidden" id="eventId">
   <div><label class="text-xs font-bold uppercase text-slate-500">Event Title</label><input id="title" required class="mt-1 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div>
   <div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-bold uppercase text-slate-500">Date</label><input id="date" type="date" required class="mt-1 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div><div><label class="text-xs font-bold uppercase text-slate-500">Time</label><input id="time" type="time" required class="mt-1 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div></div>
   <div><label class="text-xs font-bold uppercase text-slate-500">Location</label><input id="location" required class="mt-1 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></div>
   <div><label class="text-xs font-bold uppercase text-slate-500">Description</label><textarea id="description" rows="4" required class="mt-1 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></textarea></div>
   <div class="flex justify-end gap-3 pt-3"><button type="button" onclick="closeForm()" class="px-4 py-2 bg-slate-100 rounded-xl font-semibold text-sm">Cancel</button><button class="px-5 py-2 bg-indigo-600 text-white rounded-xl font-semibold text-sm">Save Event</button></div>
  </form>
 </div>
</div>
<script>
const KEY='astra_events';
const demo=[{id:'e3',title:'Visions by Code',date:'2026-09-20',time:'10:00',location:'To Be Announced',description:'An epic AI Image Generation Competition where participants compete live to engineer the most stunning visual prompts.'}];
function getEvents(){try{return JSON.parse(localStorage.getItem(KEY))||demo}catch(e){return demo}}
function setEvents(x){localStorage.setItem(KEY,JSON.stringify(x));render()}
function render(){const box=document.getElementById('events'),events=getEvents(); if(!events.length){box.innerHTML='<div class="col-span-full text-center py-12 text-slate-400">No events yet. Click Add Event.</div>';return} box.innerHTML=events.map(e=>`<div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm"><div class="flex justify-between"><span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">${e.date}</span><div class="flex gap-2"><button onclick="editEvent('${e.id}')" class="text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-pen"></i></button><button onclick="deleteEvent('${e.id}')" class="text-slate-400 hover:text-rose-600"><i class="fa-solid fa-trash"></i></button></div></div><h3 class="font-bold text-lg mt-4">${e.title}</h3><p class="text-sm text-slate-500 mt-2">${e.description}</p><div class="border-t mt-4 pt-3 text-xs text-slate-500"><i class="fa-solid fa-clock mr-1"></i>${e.time} &nbsp; <i class="fa-solid fa-location-dot mr-1"></i>${e.location}</div></div>`).join('')}
function openForm(e=null){document.getElementById('formTitle').textContent=e?'Edit Event':'Add Event';document.getElementById('eventId').value=e?.id||'';document.getElementById('title').value=e?.title||'';document.getElementById('date').value=e?.date||'';document.getElementById('time').value=e?.time||'';document.getElementById('location').value=e?.location||'';document.getElementById('description').value=e?.description||'';document.getElementById('modal').classList.add('show')}
function closeForm(){document.getElementById('modal').classList.remove('show')}
function saveEvent(ev){ev.preventDefault();let events=getEvents();let id=document.getElementById('eventId').value||'event_'+Date.now();let data={id,title:document.getElementById('title').value,date:document.getElementById('date').value,time:document.getElementById('time').value,location:document.getElementById('location').value,description:document.getElementById('description').value};let i=events.findIndex(x=>x.id===id);if(i>=0)events[i]=data;else events.push(data);setEvents(events);closeForm()}
function editEvent(id){let e=getEvents().find(x=>x.id===id);if(e)openForm(e)}
function deleteEvent(id){if(confirm('Delete this event?'))setEvents(getEvents().filter(x=>x.id!==id))}
render();
</script>
</body></html>
