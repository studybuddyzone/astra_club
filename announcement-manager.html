<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nexora - Announcement Manager</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:Inter,system-ui,sans-serif}</style></head><body class="bg-slate-50 min-h-screen text-slate-800"><header class="bg-white border-b p-4 flex justify-between items-center"><div><h1 class="text-xl font-bold">Nexora</h1><p class="text-xs text-slate-500">Announcement Management</p></div><a href="index.html" class="text-sm font-semibold text-indigo-600 hover:underline">← Back to Dashboard</a></header><main class="max-w-5xl mx-auto p-6"><div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg"></div><div class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold">Announcement Manager</h2><p class="text-sm text-slate-500">Create and manage announcements separately from the dashboard.</p></div><button onclick="openForm()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold"><i class="fa-solid fa-plus mr-2"></i>Add Announcement</button></div><div id="form" class="hidden bg-white p-6 rounded-2xl border mb-6"><form onsubmit="saveAnn(event)" class="grid gap-4"><input type="hidden" id="id"><input id="title" required placeholder="Announcement title" class="p-3 border rounded-xl"><div class="grid md:grid-cols-2 gap-4"><input id="date" type="date" required class="p-3 border rounded-xl"><input id="author" required placeholder="Author / Team" class="p-3 border rounded-xl"></div><textarea id="content" required placeholder="Announcement content" class="p-3 border rounded-xl" rows="5"></textarea><div class="flex gap-2 justify-end"><button type="button" onclick="closeForm()" class="px-4 py-2 bg-slate-100 rounded-xl">Cancel</button><button class="px-4 py-2 bg-indigo-600 text-white rounded-xl font-semibold">Save Announcement</button></div></form></div><div id="list" class="grid gap-4"></div></main><script>const key='nexora_announcements';function data(){return JSON.parse(localStorage.getItem(key)||'[]')}function saveAll(x){localStorage.setItem(key,JSON.stringify(x));render()}function openForm(item=null){document.getElementById('form').classList.remove('hidden');['id','title','date','author','content'].forEach(k=>document.getElementById(k).value=item?.[k]||'')}function closeForm(){document.getElementById('form').classList.add('hidden')}function saveAnn(e){e.preventDefault();let x=data(),id=document.getElementById('id').value||'ann_'+Date.now(),item={id,title:title.value,date:date.value,author:author.value,content:content.value},i=x.findIndex(v=>v.id===id);if(i>=0)x[i]=item;else x.push(item);saveAll(x);closeForm();toast('Announcement saved')}function editAnn(id){openForm(data().find(x=>x.id===id))}function delAnn(id){if(confirm('Delete this announcement?'))saveAll(data().filter(x=>x.id!==id))}function render(){let x=data();document.getElementById('list').innerHTML=x.length?x.map(a=>`<div class="bg-white p-5 rounded-2xl border"><div class="flex justify-between gap-4"><div><h3 class="font-bold text-lg">${a.title}</h3><p class="text-xs text-slate-400 mt-1">${a.date} · ${a.author}</p></div><div class="flex gap-2"><button onclick="editAnn('${a.id}')" class="px-3 py-2 bg-slate-100 rounded-lg">Edit</button><button onclick="delAnn('${a.id}')" class="px-3 py-2 bg-rose-100 text-rose-700 rounded-lg">Delete</button></div></div><p class="mt-4 text-sm leading-6">${a.content}</p></div>`).join(''):'<div class="bg-white p-10 rounded-2xl border text-center text-slate-400">No announcements yet.</div>'}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}render();</script></body></html>
