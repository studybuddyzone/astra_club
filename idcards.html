<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Cards — Astra</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="idcards-data.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Outfit', sans-serif; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">

<header class="sticky top-0 z-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 md:px-6 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center"><i class="fa-solid fa-id-card"></i></div>
    <div>
      <h1 class="font-display font-bold text-slate-900 dark:text-white leading-tight">ID Cards</h1>
      <p class="text-[11px] text-slate-400">Astra Club — tap a name to open their Digital ID</p>
    </div>
  </div>
  <a href="index.html" class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition"><i class="fa-solid fa-arrow-left mr-1"></i>Main Site</a>
</header>

<main class="max-w-5xl mx-auto p-5 md:p-8">
  <div class="relative mb-6 max-w-sm">
    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
    <input id="search" oninput="renderGrid()" placeholder="Search by name…" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 dark:text-white">
  </div>
  <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
</main>

<script>
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

let photoData = {};

async function loadPhotos() {
  try { const r = await fetch('/api/idcard-photos'); photoData = r.ok ? await r.json() : {}; }
  catch (e) { photoData = {}; }
  renderGrid();
}

function renderGrid() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const list = (window.ASTRA_IDCARDS || []).filter(m => m.name.toLowerCase().includes(q));
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-sm">No matching names.</div>`; return; }
  grid.innerHTML = list.map(m => {
    const photo = photoData[m.slug] && photoData[m.slug].url;
    return `
    <a href="${esc(m.file)}" class="group bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 flex flex-col items-center text-center hover:border-indigo-300 dark:hover:border-indigo-700 hover:shadow-md transition">
      ${photo
        ? `<img src="${esc(photo)}" alt="${esc(m.name)}" class="w-16 h-16 rounded-full object-cover border-2 border-white dark:border-slate-800 shadow group-hover:scale-105 transition">`
        : `<div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-xl group-hover:scale-105 transition"><i class="fa-solid fa-user"></i></div>`}
      <p class="mt-3 text-sm font-semibold text-slate-800 dark:text-slate-200 leading-tight">${esc(m.name)}</p>
      <p class="mt-1 text-[10px] font-bold uppercase tracking-wider text-indigo-500">Open ID</p>
    </a>`;
  }).join('');
}

loadPhotos();
</script>
</body>
</html>
