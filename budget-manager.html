<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Astra - Budget Manager</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:Inter,system-ui,sans-serif}</style></head><body class="bg-slate-50 min-h-screen text-slate-800"><header class="bg-white border-b p-4 flex justify-between items-center"><div><h1 class="text-xl font-bold">Astra</h1><p class="text-xs text-slate-500">Budget & Finance Management</p></div><a href="index.html" class="text-sm font-semibold text-indigo-600 hover:underline">← Back to Dashboard</a></header><main class="max-w-5xl mx-auto p-6"><div id="toast" class="fixed bottom-5 right-5 hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg"></div><div class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold">Budget Manager</h2><p class="text-sm text-slate-500">Track income, dues and expenses from a separate page.</p></div><button onclick="openForm()" class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-semibold"><i class="fa-solid fa-plus mr-2"></i>Add Transaction</button></div><div class="grid md:grid-cols-3 gap-4 mb-6"><div class="bg-white p-5 rounded-2xl border"><p class="text-xs text-slate-500">Total Income</p><h3 id="income" class="text-2xl font-bold text-emerald-600 mt-1">₹0.00</h3></div><div class="bg-white p-5 rounded-2xl border"><p class="text-xs text-slate-500">Total Expense</p><h3 id="expense" class="text-2xl font-bold text-rose-600 mt-1">₹0.00</h3></div><div class="bg-white p-5 rounded-2xl border"><p class="text-xs text-slate-500">Balance</p><h3 id="balance" class="text-2xl font-bold mt-1">₹0.00</h3></div></div><div id="form" class="hidden bg-white p-6 rounded-2xl border mb-6"><form onsubmit="saveTx(event)" class="grid md:grid-cols-2 gap-4"><input type="hidden" id="id"><select id="type" class="p-3 border rounded-xl"><option value="income">Income / Dues</option><option value="expense">Expense</option></select><input id="description" required placeholder="Description" class="p-3 border rounded-xl"><input id="category" required placeholder="Category" class="p-3 border rounded-xl"><input id="amount" type="number" min="0" step="0.01" required placeholder="Amount (₹)" class="p-3 border rounded-xl"><input id="date" type="date" required class="p-3 border rounded-xl"><div class="md:col-span-2 flex gap-2 justify-end"><button type="button" onclick="closeForm()" class="px-4 py-2 bg-slate-100 rounded-xl">Cancel</button><button class="px-4 py-2 bg-emerald-600 text-white rounded-xl font-semibold">Save Transaction</button></div></form></div><div class="bg-white rounded-2xl border overflow-hidden"><div id="list"></div></div></main><script>const key='astra_finances';function data(){return JSON.parse(localStorage.getItem(key)||'[]')}function saveAll(x){localStorage.setItem(key,JSON.stringify(x));render()}function openForm(item=null){document.getElementById('form').classList.remove('hidden');['id','type','description','category','amount','date'].forEach(k=>document.getElementById(k).value=item?.[k]??'')}function closeForm(){document.getElementById('form').classList.add('hidden')}function saveTx(e){e.preventDefault();let x=data(),id=document.getElementById('id').value||'fin_'+Date.now(),item={id,type:type.value,description:description.value,category:category.value,amount:parseFloat(amount.value),date:date.value},i=x.findIndex(v=>v.id===id);if(i>=0)x[i]=item;else x.push(item);saveAll(x);closeForm();toast('Transaction saved')}function editTx(id){openForm(data().find(x=>x.id===id))}function delTx(id){if(confirm('Delete this transaction?'))saveAll(data().filter(x=>x.id!==id))}function render(){let x=data(),inc=x.filter(v=>v.type==='income').reduce((s,v)=>s+(+v.amount||0),0),exp=x.filter(v=>v.type==='expense').reduce((s,v)=>s+(+v.amount||0),0);income.textContent='₹'+inc.toFixed(2);expense.textContent='₹'+exp.toFixed(2);balance.textContent='₹'+(inc-exp).toFixed(2);document.getElementById('list').innerHTML=x.length?`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4 text-left">Description</th><th class="p-4 text-left">Category</th><th class="p-4 text-left">Date</th><th class="p-4 text-left">Type</th><th class="p-4 text-right">Amount</th><th class="p-4"></th></tr></thead><tbody>${x.map(v=>`<tr class="border-t"><td class="p-4 font-semibold">${v.description}</td><td class="p-4">${v.category}</td><td class="p-4">${v.date}</td><td class="p-4">${v.type}</td><td class="p-4 text-right font-bold">₹${(+v.amount).toFixed(2)}</td><td class="p-4 text-right"><button onclick="editTx('${v.id}')" class="mr-2 px-3 py-1 bg-slate-100 rounded">Edit</button><button onclick="delTx('${v.id}')" class="px-3 py-1 bg-rose-100 text-rose-700 rounded">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="p-10 text-center text-slate-400">No transactions yet.</div>'}function toast(m){let t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}render();</script></body></html>
